version: 2

models:

- name: stg_subscription_history
  description: "Standardized and type-cast subscription history records extracted from the raw VARIANT landing table. Each row represents a single source subscription history record."
  
  columns:
  - name: subscription_history_id
    description: "Trimmed unique identifier for a subscription history record."
    data_tests:
    - not_null
    - unique

  - name: subscription_id
    description: "Trimmed source subscription identifier associated with the history record."
    data_tests:
    - not_null

  - name: account_id
    description: "Trimmed source account identifier associated with the history record."
    data_tests:
    - not_null

  - name: plan_id
    description: "Trimmed source plan identifier associated with the history record."
    data_tests:
    - not_null

  - name: subscription_history_status
    description: "Subscription history status, trimmed and converted to lowercase."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['active', 'canceled']
          
  - name: subscription_history_seats_count
    description: "Subscription seat count, trimmed and cast to DECIMAL(18,0)."
    data_tests:
    - not_null

  - name: subscription_history_change_type
    description: "Subscription change type, trimmed and converted to lowercase."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['new', 'upgrade', 'downgrade', 'renewal', 'churn']

  - name: subscription_history_effective_from
    description: "Subscription history effective start timestamp, trimmed and parsed as TIMESTAMP_NTZ."
    data_tests:
    - not_null

  - name: subscription_history_effective_to
    description: "Subscription history effective end timestamp, trimmed and parsed as TIMESTAMP_NTZ. Null values are allowed for open-ended history records."
    data_tests:
    - date_order:
        arguments:
          comparison_column: subscription_history_effective_from
          key_column: subscription_history_id

  - name: source_file
    description: "Original source file loaded into Snowflake."
    data_tests:
    - not_null

  - name: raw_loaded_at
    description: "Timestamp when the raw record was loaded."
    data_tests:
    - not_null

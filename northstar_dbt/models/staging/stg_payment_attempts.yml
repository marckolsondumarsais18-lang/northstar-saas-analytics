version: 2

models:
  - name: stg_payment_attempts
    description: "Standardized and type-cast payment attempt records extracted from the raw VARIANT landing table. Each row represents a single source payment attempt record."

    columns:
      - name: payment_attempt_id
        description: "Trimmed unique identifier for a payment attempt"
        data_tests:
          - not_null
          - unique 
        
      - name: account_id
        description: "Trimmed source account identifier for the payment attempt."
        data_tests:
          - not_null

      - name: invoice_id
        description: "Trimmed source invoice identifier for the payment attempt."
        data_tests:
          - not_null

      - name: payment_attempt_method
        description: "Source payment method, trimmed and converted to lowercase."
        data_tests:
          - not_null
            
      - name: payment_attempt_status
        description:  "Payment attempt status, trimmed and converted to lowercase."
        data_tests:
          - not_null
      
      - name: attempted_amount
        description: "Amount attempted to be charged, trimmed and cast to DECIMAL(18,2)."
        data_tests:
          - not_null

      - name: captured_amount
        description: "Amount successfully captured, trimmed and cast to DECIMAL(18,2)."
        data_tests:
          - not_null

      - name: failure_reason
        description: "Payment failure reason, trimmed and converted to lowercase. Null values are expected when no failure occurred or the source does not provide a failure reason."
       
      - name: payment_attempt_occurred_at
        description: "Payment attempt occurrence timestamp, trimmed and parsed as TIMESTAMP_NTZ."
        data_tests:
        - not_null

      - name: source_file
        description: "Original source file loaded into Snowflake."
        data_tests:
          - not_null

      - name: raw_loaded_at
        description: "Timestamp when the raw record was loaded."
        data_tests:
          - not_null
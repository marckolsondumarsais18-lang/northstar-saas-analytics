version: 2

models:

- name: stg_subscriptions
  description: "Standardized and type-cast subscription records extracted from the raw VARIANT landing table. Each row represents a single source subscription record."
  
  columns:
  - name: subscription_id
    description: "Trimmed unique identifier for a subscription."
    data_tests:
    - not_null
    - unique

  - name: account_id
    description: "Trimmed source account identifier associated with the subscription."
    data_tests:
    - not_null

  - name: plan_id
    description: "Trimmed source plan identifier associated with the subscription."
    data_tests:
    - not_null

  - name: subscription_status
    description: "Subscription status, trimmed and converted to lowercase."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['active', 'canceled']

  - name: subscription_seats_count
    description: "Subscription seat count, trimmed and cast to DECIMAL(18,0)."
    data_tests:
    - not_null

  - name: subscription_change_type
    description: "Subscription change type, trimmed and converted to lowercase."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['new', 'upgrade', 'downgrade', 'renewal', 'churn']

  - name: subscription_start_date
    description: "Subscription start timestamp, trimmed and parsed as TIMESTAMP_NTZ."
    data_tests:
    - not_null

  - name: subscription_end_date
    description: "Subscription end timestamp, trimmed and parsed as TIMESTAMP_NTZ. Null values are allowed for active or open-ended subscriptions."
    data_tests:
    - date_order:
        arguments:
          comparison_column: subscription_start_date
          key_column: subscription_id

  - name: source_file
    description: "Original source file loaded into Snowflake."
    data_tests:
    - not_null

  - name: raw_loaded_at
    description: "Timestamp when the raw record was loaded."
    data_tests:
    - not_null

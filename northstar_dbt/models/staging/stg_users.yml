version: 2

models:

- name: stg_users
  description: "Standardized and type-cast user records extracted from the raw VARIANT landing table. Each row represents a single source user record."
  
  columns:
  - name: user_id
    description: "Trimmed unique identifier for a user."
    data_tests:
    - not_null
    - unique

  - name: account_id
    description: "Trimmed source account identifier associated with the user."
    data_tests:
    - not_null

  - name: user_status
    description: "User status, trimmed and converted to lowercase."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['active', 'inactive']

  - name: user_role
    description: "User role, trimmed and converted to lowercase."
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: ['admin', 'member', 'viewer']

  - name: user_created_at
    description: "User creation timestamp, trimmed and parsed as TIMESTAMP_NTZ."
    data_tests:
    - not_null

  - name: user_last_seen_at
    description: "Timestamp when the user was last seen, trimmed and parsed as TIMESTAMP_NTZ. Null values are allowed when the source does not provide a last-seen timestamp."
    data_tests:
    - date_order:
        arguments:
          comparison_column: user_created_at
          key_column: user_id

  - name: source_file
    description: "Original source file loaded into Snowflake."
    data_tests:
    - not_null

  - name: raw_loaded_at
    description: "Timestamp when the raw record was loaded."
    data_tests:
    - not_null
